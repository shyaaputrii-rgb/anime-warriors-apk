name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "stickman-fight-warrior.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: stickman-fight-warrior.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "stickman-fight-warrior.apk" \
            --target "${{ github.sha }}" \
            --title "Build #${{ github.run_number }}" \
            --notes "APK otomatis dari commit ${{ github.sha }}"
